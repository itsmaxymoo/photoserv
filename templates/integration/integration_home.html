{% extends "base.html" %}
{% load render_table from django_tables2 %}

{% block title %}Integrations{% endblock %}

{% block content %}
<h2>Integrations</h2>

<div class="grid grid-cols-1 gap-6">
    <div>
        <div class="flex justify-between mb-4">
            <h3 class="text-2xl">Integration Plugins</h3>
            <div class="flex gap-2 flex-row">
                <form method="post" action="{% url 'integration-plugin-scan' %}" class="inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-secondary">
                        Scan for Plugins
                    </button>
                </form>
                <a href="{% url 'integration-plugin-create' %}" class="btn btn-primary">
                    Create
                </a>
            </div>
        </div>

        <div class="overflow-x-hidden">
            {% render_table integrations_table %}
        </div>
    </div>

    <div class="flex justify-center">
        <a href="https://github.com/photoserv/integration-plugins" target="_blank" class="mx-auto btn btn-wide">
            Get Official Plugins
        </a>
    </div>
</div>
{% endblock %}
